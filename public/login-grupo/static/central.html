        '<div class="apoio">tarefas em aberto</div></div>' +
    '</div>';
  }

  function cartaoExecucaoTarefas(){
    var h = hoje();
    var linhas = tarefas.map(function(t){
      var subs = 0, feitas = 0, atrasadas = 0;
      (t.etapas || []).forEach(function(e){
        var lista = e.subetapas || [];
        if(lista.length){
          lista.forEach(function(sb){
            subs++;
            if(sb.feito) feitas++;
            else { var pz = sb.prazo || e.prazo || ""; if(pz && pz < h) atrasadas++; }
          });
        } else {
          subs++;
          if(percentualEtapa(e) >= 100) feitas++;
          else if(e.prazo && e.prazo < h) atrasadas++;
        }
      });
      return { titulo:t.titulo || "Sem título", pct:progresso(t), subs:subs,
               feitas:feitas, atrasadas:atrasadas, prazo:t.prazoTotal };
    }).sort(function(a,b){ return b.pct - a.pct; });

    if(!linhas.length){
      return cartao("Execução por tarefa", "", '<p class="vazio-mini">Nenhuma tarefa cadastrada.</p>');
    }

    var corpo = '<div class="barras">' + linhas.map(function(l){
      return '<div class="barra-linha">' +
        '<div class="rot"><span class="nome" title="' + esc(l.titulo) + '">' + esc(l.titulo) + '</span>' +
          '<span class="valor">' + l.pct + '%</span></div>' +
        '<div class="trilha"><i style="width:' + Math.max(l.pct, 0) + '%"></i></div>' +
        '<div class="sub">' + l.feitas + ' de ' + l.subs + ' entregas' +
          (l.atrasadas ? ' · <span class="atraso">' + l.atrasadas + ' atrasada' + (l.atrasadas>1?"s":"") + '</span>' : '') +
          (l.prazo ? ' · prazo ' + dataBR(l.prazo) : '') +
        '</div></div>';
    }).join("") + '</div>';

    return cartao("Execução por tarefa", "% pelas subtarefas concluídas", corpo);
  }

  function cartaoResponsaveis(itens){
    var mapa = {};
    itens.forEach(function(i){
      var nome = (i.responsavel || "").trim() || "Sem responsável";
      if(!mapa[nome]) mapa[nome] = { nome:nome, total:0, feitas:0, atrasadas:0 };
      mapa[nome].total++;
      if(i.feito) mapa[nome].feitas++;
      if(i.atrasado) mapa[nome].atrasadas++;
    });
    var linhas = Object.keys(mapa).map(function(k){ return mapa[k]; })
      .sort(function(a,b){ return b.total - a.total; });

    if(!linhas.length){
      return cartao("Carga por responsável", "", '<p class="vazio-mini">Sem entregas atribuídas.</p>');
    }

    var corpo = '<table class="tab-resp"><thead><tr>' +
      '<th>Responsável</th><th style="width:38%">Andamento</th>' +
      '<th class="dir">Feitas</th><th class="dir">Total</th><th class="dir">Atraso</th>' +
      '</tr></thead><tbody>' +
      linhas.map(function(r){
        var pct = r.total ? Math.round(r.feitas * 100 / r.total) : 0;
        return '<tr>' +
          '<td><span class="pessoa"><span class="av">' + esc(iniciais(r.nome)) + '</span>' + esc(r.nome) + '</span></td>' +
          '<td><div class="medidor"><i style="width:' + pct + '%"></i></div></td>' +
          '<td class="dir">' + r.feitas + '</td>' +
          '<td class="dir" style="color:var(--muted)">' + r.total + '</td>' +
          '<td class="dir" style="color:' + (r.atrasadas ? "var(--crit)" : "var(--muted)") + '">' + r.atrasadas + '</td>' +
        '</tr>';
      }).join("") + '</tbody></table>';

    return cartao("Carga por responsável", "entregas por pessoa", corpo);
  }

  /* Colunas empilhadas: entregas por semana de vencimento.
     Duas séries — concluídas e pendentes — com legenda e rótulo. */
  function cartaoSemanas(itens){
    var comPrazo = itens.filter(function(i){ return !!i.prazo; });
    if(!comPrazo.length){
      return cartao("Entregas por semana", "", '<p class="vazio-mini">Nenhuma entrega tem prazo definido.</p>');
    }

    var hojeD = dataDe(hoje());
    var inicio = segundaDa(hojeD);
    inicio.setDate(inicio.getDate() - 14);            // 2 semanas de retrovisor
    var semanas = [];
    for(var k=0;k<12;k++){
      var ini = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + k*7);
      var fim = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + 6);
      semanas.push({ ini:ini, fim:fim, feitas:0, pendentes:0 });
    }
    var antes = { feitas:0, pendentes:0 }, depois = { feitas:0, pendentes:0 };
    comPrazo.forEach(function(i){
      var d = dataDe(i.prazo);
      if(!d) return;
      var alvo = null;
      for(var k=0;k<semanas.length;k++){
        if(d >= semanas[k].ini && d <= semanas[k].fim){ alvo = semanas[k]; break; }
      }
      if(!alvo) alvo = d < semanas[0].ini ? antes : depois;
      if(i.feito) alvo.feitas++; else alvo.pendentes++;
    });

    var maxV = 1;
    semanas.forEach(function(s){ maxV = Math.max(maxV, s.feitas + s.pendentes); });

    var L=34, R=8, T=26, B=40, W=560, H=222;
    var larg = (W - L - R) / semanas.length;
    var barW = Math.min(26, larg - 10);
    var alturaUtil = H - T - B;
    var esc1 = function(v){ return v / maxV * alturaUtil; };

    // grade
    var passos = [0, Math.ceil(maxV/2), maxV];
    var grade = passos.map(function(v){
      var y = T + alturaUtil - esc1(v);
      return '<line class="grade" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W-R) + '" y2="' + y.toFixed(1) + '"></line>' +
             '<text class="eixo-txt" x="' + (L-7) + '" y="' + (y+3.5).toFixed(1) + '" text-anchor="end">' + v + '</text>';
    }).join("");

    var barras = semanas.map(function(s, idx){
      var x = L + idx*larg + (larg - barW)/2;
      var total = s.feitas + s.pendentes;
      var base = T + alturaUtil;
      var out = "";
      var hPend = esc1(s.pendentes), hFeito = esc1(s.feitas);
      // pendentes em cima, concluídas embaixo, com 2px de respiro entre elas
      if(s.feitas > 0){
        out += '<rect class="col-feito" x="' + x.toFixed(1) + '" y="' + (base - hFeito).toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' + hFeito.toFixed(1) + '" rx="0"></rect>';
      }
      if(s.pendentes > 0){
        var yP = base - hFeito - hPend - (s.feitas > 0 ? 2 : 0);
        out += '<rect class="col-pendente" x="' + x.toFixed(1) + '" y="' + yP.toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' + Math.max(hPend,1).toFixed(1) + '" rx="3"></rect>';
      }
      if(total > 0){
        var yT = base - hFeito - hPend - (s.feitas > 0 ? 2 : 0) - 5;
        out += '<text class="rotulo-col" x="' + (x + barW/2).toFixed(1) + '" y="' + yT.toFixed(1) + '" text-anchor="middle">' + total + '</text>';
      }
      var rotulo = s.ini.getDate() + "/" + MES_CURTO[s.ini.getMonth()];
      out += '<text class="eixo-txt" x="' + (x + barW/2).toFixed(1) + '" y="' + (base + 15) + '" text-anchor="middle">' + rotulo + '</text>';
      // área de captura para a dica
      out += '<rect class="alvo-col" x="' + (L + idx*larg).toFixed(1) + '" y="' + T + '" width="' + larg.toFixed(1) +
             '" height="' + alturaUtil + '" fill="transparent" ' +
             'data-dica="Semana de ' + s.ini.getDate() + "/" + MES_CURTO[s.ini.getMonth()] +
             " a " + s.fim.getDate() + "/" + MES_CURTO[s.fim.getMonth()] +
             ' — ' + s.feitas + ' concluída' + (s.feitas===1?"":"s") + ', ' + s.pendentes + ' pendente' + (s.pendentes===1?"":"s") + '"></rect>';
      return out;
    }).join("");

    // marca do dia de hoje
    var marca = "";
    for(var k=0;k<semanas.length;k++){
      if(hojeD >= semanas[k].ini && hojeD <= semanas[k].fim){
        var xh = L + k*larg + larg/2;
        marca = '<line class="marca-hoje" x1="' + xh.toFixed(1) + '" y1="' + (T-4) + '" x2="' + xh.toFixed(1) + '" y2="' + (T+alturaUtil) + '"></line>' +
                '<text class="eixo-txt" x="' + xh.toFixed(1) + '" y="' + (T-9) + '" text-anchor="middle" style="fill:var(--crit)">hoje</text>';
        break;
      }
    }

    var svg = '<div class="grafico-semanas"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="Entregas por semana de vencimento, separando concluídas e pendentes.">' +
      grade + marca + barras +
      '<line class="grade" x1="' + L + '" y1="' + (T+alturaUtil) + '" x2="' + (W-R) + '" y2="' + (T+alturaUtil) + '"></line>' +
      '</svg></div>';

    var fora = "";
    if(antes.feitas + antes.pendentes > 0 || depois.feitas + depois.pendentes > 0){
      fora = '<p class="vazio-mini" style="margin-top:8px">Fora da janela: ' +
        (antes.feitas + antes.pendentes) + ' antes · ' + (depois.feitas + depois.pendentes) + ' depois.</p>';
    }

    var legenda = '<span class="legenda">' +
      '<span><i class="feito"></i>Concluídas</span>' +
      '<span><i class="pendente"></i>Pendentes</span></span>';

    return cartao("Entregas por semana", legenda, svg + fora);
  }

  function cartaoProximas(itens){
    var h = hoje();
    var hojeD = dataDe(h);
    var limite = new Date(hojeD.getFullYear(), hojeD.getMonth(), hojeD.getDate() + 14);
    var lista = itens.filter(function(i){
      if(i.feito || !i.prazo) return false;
      var d = dataDe(i.prazo);
      return d && d <= limite;
    }).sort(function(a,b){ return a.prazo.localeCompare(b.prazo); }).slice(0, 12);

    if(!lista.length){
      return cartao("Próximas entregas", "14 dias", '<p class="vazio-mini">Nada vencendo nos próximos 14 dias.</p>');
    }

    var corpo = '<div class="lista-entregas rolante">' + lista.map(function(i){
      var d = dataDe(i.prazo);
      var dif = diasEntre(hojeD, d);
      var estado = dif < 0 ? "atrasado" : (dif === 0 ? "hoje" : "");
      var quando = dif < 0 ? Math.abs(dif) + "d atrás" : (dif === 0 ? "hoje" : "em " + dif + "d");
      return '<div class="entrega ' + estado + '">' +
        '<span class="quando">' + quando + '</span>' +
        '<span class="marcador ' + estado + '"></span>' +
        '<span class="txt"><b>' + esc(i.nome) + '</b>' +
          '<span>' + esc(i.tarefa.titulo || "Sem título") +
          (i.tipo === "sub" ? " · " + esc(i.etapa.nome || "etapa") : "") +
          (i.responsavel ? " · " + esc(i.responsavel) : "") + '</span></span>' +
        '<span class="crono-info">' + dataBR(i.prazo) + '</span>' +
      '</div>';
    }).join("") + '</div>';

    return cartao("Próximas entregas", "14 dias · só o que está em aberto", corpo);
  }

  function cartao(titulo, legenda, conteudo){
    return '<section class="cartao"><header><h3>' + titulo + '</h3>' +
      (legenda ? (legenda.indexOf("<") === 0 ? legenda : '<span class="legenda-titulo">' + legenda + '</span>') : '') +
      '</header><div class="conteudo">' + conteudo + '</div></section>';
  }

  /* dica flutuante nas colunas do gráfico */
  function ligarDicasColunas(raiz){
    var dica = document.getElementById("dica-grafico");
    if(!dica){
      dica = document.createElement("div");
      dica.id = "dica-grafico";
      dica.style.cssText = "position:fixed;z-index:60;pointer-events:none;display:none;" +
        "background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;" +
        "border-radius:5px;max-width:260px;line-height:1.35;box-shadow:var(--shadow-lg)";
      document.body.appendChild(dica);
    }
    Array.prototype.forEach.call(raiz.querySelectorAll("[data-dica]"), function(el){
      el.addEventListener("mousemove", function(ev){
        dica.textContent = el.dataset.dica;
        dica.style.display = "block";
        dica.style.left = Math.min(ev.clientX + 14, window.innerWidth - 270) + "px";
        dica.style.top = (ev.clientY + 16) + "px";
      });
      el.addEventListener("mouseleave", function(){ dica.style.display = "none"; });
    });
  }

  /* ---------- aba: CRONOGRAMA ---------- */
  function inicioEtapa(tarefa, etapas, idx){
    // Sem data de início cadastrada, a barra vai do fim da etapa anterior
    // (ou da criação da tarefa) até o prazo — é o período de execução.
    if(idx > 0 && etapas[idx-1].prazo) return etapas[idx-1].prazo;
    var criado = (tarefa.criadoEm || "").slice(0, 10);
    return criado || etapas[idx].prazo;
  }

  function pintarCronograma(destino){
    var datas = [];
    tarefas.forEach(function(t){
      if(t.prazoTotal) datas.push(t.prazoTotal);
      (t.etapas || []).forEach(function(e){
        if(e.prazo) datas.push(e.prazo);
        (e.subetapas || []).forEach(function(sb){ if(sb.prazo) datas.push(sb.prazo); });
      });
    });
    datas.push(hoje());
    if(!datas.length){
      destino.innerHTML = '<div class="vazio"><b>Sem datas para montar o cronograma</b>' +
        'Informe o prazo das etapas para elas aparecerem aqui.</div>';
      return;
    }
    datas.sort();
    var ini = dataDe(datas[0]), fim = dataDe(datas[datas.length-1]);
    ini = new Date(ini.getFullYear(), ini.getMonth(), 1);
    fim = new Date(fim.getFullYear(), fim.getMonth() + 1, 0);
    var totalDias = Math.max(diasEntre(ini, fim), 1);
    var pos = function(iso){
      var d = dataDe(iso);
      if(!d) return null;
      var p = diasEntre(ini, d) / totalDias * 100;
      return Math.max(0, Math.min(100, p));
    };

    // faixa de meses
    var meses = [], cursor = new Date(ini.getFullYear(), ini.getMonth(), 1);
    while(cursor <= fim){
      var proximo = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      var ultimoDia = new Date(proximo.getFullYear(), proximo.getMonth(), 0);
      meses.push({
        rotulo: MES_LONGO[cursor.getMonth()].slice(0,3) + "/" + String(cursor.getFullYear()).slice(2),
        inicio: diasEntre(ini, cursor) / totalDias * 100,
        largura: (diasEntre(cursor, ultimoDia) + 1) / totalDias * 100
      });
      cursor = proximo;
    }
    var divisores = meses.map(function(m){
      return '<span class="divisor" style="left:' + m.inicio.toFixed(3) + '%"></span>';
    }).join("");
    var pHoje = pos(hoje());
    var linhaHoje = pHoje === null ? "" : '<span class="hoje-linha" style="left:' + pHoje.toFixed(3) + '%"></span>';

    var linhas = "";
    tarefas.forEach(function(t){
      var etapas = (t.etapas || []).slice().sort(function(a,b){
        return (a.prazo || "9999").localeCompare(b.prazo || "9999");
      });
      var pct = progresso(t);
      linhas += '<div class="crono-linha tarefa">' +
        '<div class="nome-cel"><span class="rotulo-txt" title="' + esc(t.titulo) + '">' + esc(t.titulo || "Sem título") + '</span>' +
          '<span class="crono-info">' + pct + '%</span></div>' +
        '<div class="faixa">' + divisores + linhaHoje + barraTarefa(t, etapas, pos) + '</div></div>';

      etapas.forEach(function(e, idx){
        var pe = percentualEtapa(e);
        var ini2 = inicioEtapa(t, etapas, idx);
        var a = pos(ini2), b = pos(e.prazo);
        var barra = "";
        var atrasada = pe < 100 && e.prazo && e.prazo < hoje();
        var dicaEtapa = esc(e.nome || "Etapa") + " — " + pe + '% · prazo ' + dataBR(e.prazo);
        if(a !== null && b !== null && Math.abs(b - a) >= 1.2){
          var esq = Math.min(a, b), larg = Math.abs(b - a);
          barra = '<span class="crono-barra ' + (pe>=100 ? "completa" : "") + ' ' + (atrasada ? "atrasada" : "") + '" ' +
            'style="left:' + esq.toFixed(3) + '%;width:' + larg.toFixed(3) + '%" ' +
            'data-dica="' + dicaEtapa + '">' +
            '<i style="width:' + pe + '%"></i></span>';
        } else if(b !== null){
          // Etapas que caem no mesmo dia da anterior não têm período: viram marco.
          barra = '<span class="crono-ponto ' + (pe>=100 ? "feito" : (atrasada ? "atrasado" : "")) +
            '" style="left:' + b.toFixed(3) + '%" data-dica="' + dicaEtapa + '"></span>';
        } else if(false){
          barra = '<span class="crono-ponto ' + (pe>=100 ? "feito" : "") + '" style="left:' + b.toFixed(3) + '%"></span>';
        }
        var subs = e.subetapas || [];
        var aberta = !!abertasCrono[e.id];
        linhas += '<div class="crono-linha etapa">' +
          '<div class="nome-cel">' +
            (subs.length ? '<button class="expandir" data-exp="' + e.id + '" aria-label="Ver subtarefas">' + (aberta ? "−" : "+") + '</button>' : '<span style="width:19px;flex:none"></span>') +
            '<span class="rotulo-txt" title="' + esc(e.nome) + '">' + esc(e.nome || "Etapa sem nome") + '</span>' +
            '<span class="crono-info">' + pe + '%</span></div>' +
          '<div class="faixa">' + divisores + linhaHoje + barra + '</div></div>';

        if(aberta){
          subs.forEach(function(sb){
            var pz = sb.prazo || e.prazo || "";
            var p = pos(pz);
            var atrasado = !sb.feito && pz && pz < hoje();
            var ponto = p === null ? "" :
              '<span class="crono-ponto ' + (sb.feito ? "feito" : (atrasado ? "atrasado" : "")) + '" ' +
              'style="left:' + p.toFixed(3) + '%" data-dica="' + esc(sb.nome || "Subtarefa") +
              (pz ? " — prazo " + dataBR(pz) : "") +
              (sb.feito ? " · concluída" + (sb.concluidoEm ? " em " + dataBR(sb.concluidoEm) : "") : " · pendente") + '"></span>';
            linhas += '<div class="crono-linha sub">' +
              '<div class="nome-cel"><span class="rotulo-txt" style="' + (sb.feito ? "text-decoration:line-through" : "") + '">' +
                esc(sb.nome || "Subtarefa sem nome") + '</span></div>' +
              '<div class="faixa">' + divisores + linhaHoje + ponto + '</div></div>';
          });
        }
      });
    });

    destino.innerHTML =
      '<div class="legenda" style="margin-bottom:12px">' +
        '<span><i class="feito"></i>Executado</span>' +
        '<span><i class="pendente"></i>A executar</span>' +
        '<span><i style="background:var(--crit)"></i>Atrasado</span>' +
        '<span style="margin-left:auto">A barra vai do fim da etapa anterior até o prazo.</span>' +
      '</div>' +
      '<div class="crono"><div class="crono-rolagem"><div class="crono-grade" style="--col-nome:290px">' +
        '<div class="crono-cab"><div class="celula-nome">Tarefa / etapa</div>' +
          '<div class="crono-meses">' + meses.map(function(m){
            return '<div class="crono-mes" style="width:' + m.largura.toFixed(3) + '%">' + m.rotulo + '</div>';
          }).join("") + '</div></div>' +
        linhas +
      '</div></div></div>';

    Array.prototype.forEach.call(destino.querySelectorAll("[data-exp]"), function(b){
      b.addEventListener("click", function(){
        var id = b.dataset.exp;
        abertasCrono[id] = !abertasCrono[id];
        pintarAba();
      });
    });
    ligarDicasColunas(destino);
  }

  function barraTarefa(t, etapas, pos){
    var datas = etapas.map(function(e){ return e.prazo; }).filter(Boolean);
    if(t.prazoTotal) datas.push(t.prazoTotal);
    if(!datas.length) return "";
    datas.sort();
    var criado = (t.criadoEm || "").slice(0,10);
    var a = pos(criado || datas[0]), b = pos(datas[datas.length-1]);
    if(a === null || b === null) return "";
    var esq = Math.min(a,b), larg = Math.max(Math.abs(b-a), 0.8);
    var pct = progresso(t);
    return '<span class="crono-barra ' + (pct>=100 ? "completa" : "") + '" style="left:' + esq.toFixed(3) +
      '%;width:' + larg.toFixed(3) + '%;height:20px" data-dica="' + esc(t.titulo || "Tarefa") +
      ' — ' + pct + '% · prazo ' + dataBR(t.prazoTotal) + '"><i style="width:' + pct + '%"></i></span>';
  }

  /* ---------- aba: CALENDÁRIO ---------- */
  function pintarCalendario(destino){
    var hojeD = dataDe(hoje());
    var itens = listaItens().filter(function(i){ return !!i.prazo; });

    if(!mesCal){
      // Abre no mês corrente; se ele estiver vazio, vai para o primeiro mês
      // que tem entrega — ninguém quer abrir um calendário em branco.
      mesCal = { ano:hojeD.getFullYear(), mes:hojeD.getMonth() };
      var temNoMes = itens.some(function(i){
        var d = dataDe(i.prazo);
        return d && d.getMonth() === mesCal.mes && d.getFullYear() === mesCal.ano;
      });
      if(!temNoMes && itens.length){
        var futuras = itens.map(function(i){ return i.prazo; })
          .filter(function(x){ return x >= hoje(); }).sort();
        var alvoIso = futuras.length ? futuras[0] : itens.map(function(i){ return i.prazo; }).sort().pop();
        var dAlvo = dataDe(alvoIso);
        if(dAlvo) mesCal = { ano:dAlvo.getFullYear(), mes:dAlvo.getMonth() };
      }
      if(!diaSel) diaSel = hoje();
    }
    var porDia = {};
    itens.forEach(function(i){
      if(!porDia[i.prazo]) porDia[i.prazo] = [];
      porDia[i.prazo].push(i);
    });

    var primeiro = new Date(mesCal.ano, mesCal.mes, 1);
    var inicioGrade = new Date(primeiro.getFullYear(), primeiro.getMonth(), 1 - primeiro.getDay());
    var celulas = "";
    for(var k=0;k<42;k++){
      var d = new Date(inicioGrade.getFullYear(), inicioGrade.getMonth(), inicioGrade.getDate() + k);
      var iso = isoDe(d);
      var doMes = d.getMonth() === mesCal.mes;
      var doDia = porDia[iso] || [];
      var fitas = doDia.slice(0, 3).map(function(i){
        var classe = i.feito ? "feito" : (i.atrasado ? "atrasado" : "pendente");
        return '<span class="fita ' + classe + ' ' + (i.tipo === "etapa" ? "etapa" : "") + '" title="' +
          esc(i.nome) + ' — ' + esc(i.tarefa.titulo || "") + '">' + esc(i.nome) + '</span>';
      }).join("");
      var mais = doDia.length > 3 ? '<span class="mais">+' + (doDia.length - 3) + '</span>' : "";
      celulas += '<button class="dia ' + (doMes ? "" : "fora") + ' ' + (iso === hoje() ? "hoje" : "") +
        ' ' + (iso === diaSel ? "selecionado" : "") + '" data-dia="' + iso + '">' +
        '<span class="n">' + d.getDate() + '</span>' + fitas + mais + '</button>';
    }

    var doMesTotal = itens.filter(function(i){
      var d = dataDe(i.prazo);
      return d && d.getMonth() === mesCal.mes && d.getFullYear() === mesCal.ano;
    });
    var feitasMes = doMesTotal.filter(function(i){ return i.feito; }).length;

    destino.innerHTML =
      '<div class="cal-topo">' +
        '<div class="nav-mes"><button id="mes-ant" aria-label="Mês anterior">‹</button>' +
          '<button id="mes-prox" aria-label="Próximo mês">›</button></div>' +
        '<h3>' + MES_LONGO[mesCal.mes] + ' de ' + mesCal.ano + '</h3>' +
        '<button class="btn pequeno" id="mes-hoje">Hoje</button>' +
        '<span class="legenda" style="margin-left:auto">' +
          '<span><i class="feito"></i>Concluído</span>' +
          '<span><i class="pendente"></i>Pendente</span>' +
          '<span><i style="background:var(--crit)"></i>Atrasado</span></span>' +
      '</div>' +
      '<p class="vazio-mini" style="margin:-6px 0 12px">' + doMesTotal.length +
        ' entregas vencem neste mês · ' + feitasMes + ' já concluídas.</p>' +
      '<div class="cal-malha">' +
        DIA_CURTO.map(function(n){ return '<div class="cal-cab">' + n + '</div>'; }).join("") +
        celulas +
      '</div>' +
      '<div class="dia-detalhe" id="dia-detalhe"></div>';

    document.getElementById("mes-ant").addEventListener("click", function(){
      mesCal = mesCal.mes === 0 ? { ano:mesCal.ano-1, mes:11 } : { ano:mesCal.ano, mes:mesCal.mes-1 };
      pintarAba();
    });
    document.getElementById("mes-prox").addEventListener("click", function(){
      mesCal = mesCal.mes === 11 ? { ano:mesCal.ano+1, mes:0 } : { ano:mesCal.ano, mes:mesCal.mes+1 };
      pintarAba();
    });
    document.getElementById("mes-hoje").addEventListener("click", function(){
      mesCal = { ano:hojeD.getFullYear(), mes:hojeD.getMonth() };
      diaSel = hoje();
      pintarAba();
    });
    Array.prototype.forEach.call(destino.querySelectorAll("[data-dia]"), function(b){
      b.addEventListener("click", function(){
        diaSel = b.dataset.dia;
        pintarAba();
      });
    });

    if(diaSel){
      var doDiaSel = porDia[diaSel] || [];
      var caixa = document.getElementById("dia-detalhe");
      caixa.innerHTML = cartao(
        dataBR(diaSel),
        doDiaSel.length + (doDiaSel.length === 1 ? " entrega" : " entregas"),
        doDiaSel.length
          ? '<div class="lista-entregas">' + doDiaSel.map(function(i){
              var estado = i.feito ? "feito" : (i.atrasado ? "atrasado" : "");
              return '<div class="entrega">' +
                '<span class="marcador ' + estado + '"></span>' +
                '<span class="txt"><b style="' + (i.feito ? "text-decoration:line-through;color:var(--muted)" : "") + '">' +
                  esc(i.nome) + '</b><span>' + esc(i.tarefa.titulo || "") +
                  (i.tipo === "sub" ? " · " + esc(i.etapa.nome || "") : "") +
                  (i.responsavel ? " · " + esc(i.responsavel) : "") + '</span></span>' +
                '<span class="crono-info">' + (i.feito ? "concluída" : (i.atrasado ? "atrasada" : "pendente")) + '</span>' +
              '</div>';
            }).join("") + '</div>'
          : '<p class="vazio-mini">Nada vencendo neste dia.</p>'
      );
    }
  }

  /* ---------------- painel de detalhe ---------------- */
  function abrirPainel(id, focarTitulo){
    var t = null;
    for(var i=0;i<tarefas.length;i++){ if(tarefas[i].id === id){ t = tarefas[i]; break; } }
    if(!t) return;
    rascunho = JSON.parse(JSON.stringify(t));
    montarPainel();
    if(focarTitulo){
      var c = document.getElementById("c-titulo");
      if(c) c.focus();
    }
  }

  function fecharPainel(){
    if(rascunho && timerSalvar) salvarAgora();
    var f = document.getElementById("fundo-painel");
    var p = document.getElementById("painel");
    if(f) f.remove();
    if(p) p.remove();
    document.removeEventListener("keydown", escFechar);
    rascunho = null;
    if(timerSalvar){ clearTimeout(timerSalvar); timerSalvar = null; }
  }

  function escFechar(ev){
    if(ev.key === "Escape" && document.getElementById("painel")) fecharPainel();
  }

  function montarPainel(){
    var vf = document.getElementById("fundo-painel");
    var vp = document.getElementById("painel");
    if(vf) vf.remove();
    if(vp) vp.remove();
    var t = rascunho;

    var fundo = document.createElement("div");
    fundo.className = "fundo"; fundo.id = "fundo-painel";
    fundo.addEventListener("click", function(){ fecharPainel(); });

    var p = document.createElement("aside");
    p.className = "painel"; p.id = "painel";
    p.setAttribute("role","dialog");
    p.setAttribute("aria-label","Detalhe da tarefa");
    p.innerHTML = '' +
      '<header><div class="t"><p>Tarefa</p></div>' +
        '<span class="salvo" id="ind-salvo"></span>' +
        '<button class="fechar" id="btn-fechar" aria-label="Fechar">×</button></header>' +
      '<div class="corpo">' +
        '<div class="bloco">' +
          '<div class="f"><label for="c-titulo">Tarefa</label>' +
            '<input id="c-titulo" data-campo="titulo" value="' + esc(t.titulo) + '" placeholder="O que precisa ser feito"></div>' +
          '<div class="linha2">' +
            '<div class="f"><label for="c-resp">Responsável</label>' +
              '<input id="c-resp" data-campo="responsavel" value="' + esc(t.responsavel) + '" placeholder="Quem conduz"></div>' +
            '<div class="f"><label for="c-status">Status</label><select id="c-status" data-campo="status">' +
              COLUNAS.map(function(c){ return '<option value="' + c.id + '"' + (t.status === c.id ? " selected" : "") + '>' + c.nome + '</option>'; }).join("") +
            '</select></div>' +
          '</div>' +
          '<div class="linha2">' +
            '<div class="f"><label for="c-prioridade">Prioridade</label>' +
              '<select id="c-prioridade" data-campo="prioridade">' +
              PRIORIDADES.map(function(x){
                return '<option value="' + x.id + '"' + (prioridadeDe(t) === x.id ? " selected" : "") + '>' + x.nome + '</option>';
              }).join("") + '</select></div>' +
            '<div class="f"><label for="c-prazo">Prazo total da tarefa</label>' +
              '<input id="c-prazo" type="date" data-campo="prazoTotal" value="' + esc(t.prazoTotal) + '"></div>' +
          '</div>' +
          '<div class="f"><label for="c-desc">Descrição</label>' +
            '<textarea id="c-desc" data-campo="descricao" placeholder="Contexto, objetivo, entregável">' + esc(t.descricao) + '</textarea></div>' +
        '</div>' +
        '<div class="total-box">' +
          '<div class="cab"><span>Execução total</span><b id="tot-pct">0%</b></div>' +
          '<div class="prog"><span class="trilho"><i id="tot-barra" style="width:0%"></i></span></div>' +
          '<span class="nota-calc" id="tot-nota"></span>' +
        '</div>' +
        '<div class="bloco"><div class="rotulo">Etapas</div>' +
          '<div id="lista-etapas" style="display:flex;flex-direction:column;gap:10px"></div>' +
          '<button class="btn pequeno" id="add-etapa" style="align-self:flex-start">+ Adicionar etapa</button>' +
        '</div>' +
      '</div>' +
      '<footer><button class="btn perigo" id="excluir">Excluir tarefa</button>' +
        '<span class="espaco"></span>' +
        '<button class="btn primario" id="concluir">Salvar e fechar</button></footer>';

    document.body.appendChild(fundo);
    document.body.appendChild(p);

    Array.prototype.forEach.call(p.querySelectorAll("[data-campo]"), function(el){
      var ev = (el.tagName === "SELECT" || el.type === "date") ? "change" : "input";
      el.addEventListener(ev, function(){
        rascunho[el.dataset.campo] = el.value;
        agendarSalvar();
      });
    });

    document.getElementById("btn-fechar").addEventListener("click", function(){ fecharPainel(); });
    document.getElementById("concluir").addEventListener("click", function(){ fecharPainel(); });
    document.getElementById("add-etapa").addEventListener("click", function(){
      rascunho.etapas.push({ id:novoId(), nome:"", responsavel:"", prazo:"", percentual:0,
                             observacoes:"", subetapas:[] });
      pintarEtapas(true);
      agendarSalvar();
    });
    document.getElementById("excluir").addEventListener("click", function(){
      var id = rascunho.id;
      rascunho = null;
      if(timerSalvar){ clearTimeout(timerSalvar); timerSalvar = null; }
      fecharPainel();
      apagar(id).then(function(){ pintarPlano(); }, function(){ pintarPlano(); });
    });

    document.addEventListener("keydown", escFechar);
    pintarEtapas(false);
  }

  function pintarEtapas(focarUltima){
    var caixa = document.getElementById("lista-etapas");
    if(!caixa) return;
    var et = rascunho.etapas || [];

    if(!et.length){
      caixa.innerHTML = '<div class="vazio" style="padding:18px"><b>Sem etapas</b>' +
        'Quebre a tarefa em etapas com prazo e percentual — a execução total é a média delas.</div>';
      atualizarTotal();
      return;
    }

    caixa.innerHTML = et.map(function(e, i){
      return '<div class="etapa" data-et="' + e.id + '">' +
        '<div class="cab"><span class="idx">' + String(i+1).padStart(2,"0") + '</span>' +
          '<input class="nome" data-et-campo="nome" value="' + esc(e.nome) + '" placeholder="Nome da etapa">' +
          '<button class="rm" data-rm="' + e.id + '" aria-label="Remover etapa">×</button></div>' +
        '<div class="linha2">' +
          '<div class="f"><label>Responsável</label>' +
            '<input data-et-campo="responsavel" value="' + esc(e.responsavel) + '" placeholder="Quem executa"></div>' +
          '<div class="f"><label>Prazo de entrega</label>' +
            '<input type="date" data-et-campo="prazo" value="' + esc(e.prazo) + '"></div>' +
        '</div>' +
        '<div class="sub-bloco">' +
          '<div class="cab-sub"><span class="rot-sub">Subetapas</span>' +
            '<span class="contagem" data-contagem></span></div>' +
          '<div class="sub-lista" data-sublista></div>' +
          '<button type="button" class="add-sub" data-add-sub>+ Adicionar subetapa</button>' +
        '</div>' +
        '<div class="f"><label>Execução</label><div data-exec></div></div>' +
        (!(e.subetapas || []).length && percentualEtapa(e) < 100 && e.prazo && e.prazo < hoje()
          ? '<div class="f"><label style="color:var(--crit)">Motivo da pendência</label>' +
            '<input data-et-campo="motivo" value="' + esc(e.motivo || "") + '" placeholder="Por que está pendente?"></div>'
          : '') +
        '<div class="f"><label>Observações</label>' +
          '<textarea data-et-campo="observacoes" placeholder="Imprevistos, pendências, quem está travando">' + esc(e.observacoes) + '</textarea></div>' +
      '</div>';
    }).join("");

    Array.prototype.forEach.call(caixa.querySelectorAll(".etapa"), function(bloco){
      var id = bloco.dataset.et;
      var alvo = null;
      for(var i=0;i<rascunho.etapas.length;i++){ if(rascunho.etapas[i].id === id){ alvo = rascunho.etapas[i]; break; } }
      Array.prototype.forEach.call(bloco.querySelectorAll("[data-et-campo]"), function(el){
        var campo = el.dataset.etCampo;
        var ev = el.type === "date" ? "change" : "input";
        el.addEventListener(ev, function(){
          if(campo === "percentual"){
            alvo.percentual = Number(el.value);
            bloco.querySelector(".pcte .n").textContent = alvo.percentual + "%";
            atualizarTotal();
          } else {
            alvo[campo] = el.value;
          }
          agendarSalvar();
        });
      });
      bloco.querySelector("[data-rm]").addEventListener("click", function(){
        rascunho.etapas = rascunho.etapas.filter(function(x){ return x.id !== id; });
        pintarEtapas(false);
        agendarSalvar();
      });

      bloco.querySelector("[data-add-sub]").addEventListener("click", function(){
        if(!alvo.subetapas) alvo.subetapas = [];
        alvo.subetapas.push({ id:novoId(), nome:"", feito:false });
        pintarSubetapas(bloco, alvo, true);
        agendarSalvar();
      });

      pintarSubetapas(bloco, alvo, false);
    });

    atualizarTotal();
    if(focarUltima){
      var todos = caixa.querySelectorAll("input.nome");
      if(todos.length) todos[todos.length-1].focus();
    }
  }

  function pintarSubetapas(bloco, etapa, focarUltima){
    var lista = bloco.querySelector("[data-sublista]");
    var contagem = bloco.querySelector("[data-contagem]");
    var exec = bloco.querySelector("[data-exec]");
    var subs = etapa.subetapas || [];
    var pct = percentualEtapa(etapa);

    // lista de checks
    if(!subs.length){
      lista.innerHTML = '<p style="margin:0;font-size:12.5px;color:var(--muted)">' +
        'Sem subetapas — a execução desta etapa fica na régua abaixo.</p>';
      contagem.textContent = "";
    } else {
      var feitas = subs.filter(function(x){ return !!x.feito; }).length;
      contagem.textContent = feitas + "/" + subs.length;
      lista.innerHTML = subs.map(function(sb){
        return '<div class="sub ' + (sb.feito ? "feito" : "") + '" data-sub="' + sb.id + '">' +
          '<input type="checkbox" data-sub-feito' + (sb.feito ? " checked" : "") +
            ' aria-label="Concluir subetapa">' +
          '<input class="nome-sub" data-sub-nome value="' + esc(sb.nome) + '" placeholder="O que precisa ser feito">' +
          '<button type="button" class="rm-sub" data-sub-rm aria-label="Remover subetapa">×</button>' +
        '</div>' +
        (!sb.feito && (sb.prazo || etapa.prazo) && (sb.prazo || etapa.prazo) < hoje()
          ? '<div class="sub-motivo" data-sub-motivo-de="' + sb.id + '"><label>Motivo da pendência</label>' +
            '<input data-sub-motivo value="' + esc(sb.motivo || "") + '" placeholder="Por que está pendente?"></div>'
          : '');
      }).join("");
    }

    // área de execução: automática com check, manual sem check
    if(subs.length){
      exec.innerHTML = '<div class="exec-auto">' +
        '<span class="trilho"><i class="' + (pct>=100 ? "full" : "") + '" style="width:' + pct + '%"></i></span>' +
        '<span class="n">' + pct + '%</span>' +
        '<span class="porque">pelas subetapas</span></div>';
    } else {
      var manual = Number(etapa.percentual) || 0;
      exec.innerHTML = '<div class="pcte">' +
        '<input type="range" min="0" max="100" step="5" value="' + manual + '">' +
        '<span class="n">' + manual + '%</span></div>';
      var regua = exec.querySelector("input[type=range]");
      regua.addEventListener("input", function(){
        etapa.percentual = Number(regua.value);
        exec.querySelector(".n").textContent = etapa.percentual + "%";
        atualizarTotal();
        agendarSalvar();
      });
    }

    // eventos de cada subetapa
    Array.prototype.forEach.call(lista.querySelectorAll("[data-sub]"), function(linha){
      var sid = linha.dataset.sub;
      var sub = null;
      for(var i=0;i<subs.length;i++){ if(subs[i].id === sid){ sub = subs[i]; break; } }
      if(!sub) return;

      linha.querySelector("[data-sub-feito]").addEventListener("change", function(ev){
        sub.feito = ev.target.checked;
        linha.classList.toggle("feito", sub.feito);
        atualizarExecucao(bloco, etapa);
        atualizarTotal();
        agendarSalvar();
      });
      linha.querySelector("[data-sub-nome]").addEventListener("input", function(ev){
        sub.nome = ev.target.value;
        agendarSalvar();
      });
      var campoMotivo = lista.querySelector('[data-sub-motivo-de="' + sid + '"] input');
      if(campoMotivo) campoMotivo.addEventListener("input", function(ev){
        sub.motivo = ev.target.value;
        agendarSalvar();
      });
      linha.querySelector("[data-sub-rm]").addEventListener("click", function(){
        etapa.subetapas = etapa.subetapas.filter(function(x){ return x.id !== sid; });
        pintarSubetapas(bloco, etapa, false);
        atualizarTotal();
        agendarSalvar();
      });
    });

    if(focarUltima){
      var campos = lista.querySelectorAll("input.nome-sub");
      if(campos.length) campos[campos.length-1].focus();
    }
  }

  // Atualiza só os números da etapa, sem redesenhar a lista (não perde o foco).
  function atualizarExecucao(bloco, etapa){
    var subs = etapa.subetapas || [];
    var pct = percentualEtapa(etapa);
    var contagem = bloco.querySelector("[data-contagem]");
    if(contagem && subs.length){
      contagem.textContent = subs.filter(function(x){ return !!x.feito; }).length + "/" + subs.length;
    }
    var barra = bloco.querySelector("[data-exec] .trilho i");
    var numero = bloco.querySelector("[data-exec] .n");
    if(barra){ barra.style.width = pct + "%"; barra.className = pct >= 100 ? "full" : ""; }
    if(numero){ numero.textContent = pct + "%"; }
  }

  function atualizarTotal(){
    var p = progresso(rascunho);
    var el = document.getElementById("tot-pct");
    if(!el) return;
    var barra = document.getElementById("tot-barra");
    var nota = document.getElementById("tot-nota");
    el.textContent = p + "%";
    barra.style.width = p + "%";
    barra.className = p >= 100 ? "full" : "";
    var n = (rascunho.etapas || []).length;
    nota.textContent = n
      ? "Média dos percentuais das " + n + (n>1 ? " etapas." : " etapa.")
      : "Sem etapas — adicione etapas para calcular a execução.";
  }

  function agendarSalvar(){
    var ind = document.getElementById("ind-salvo");
    if(ind){ ind.textContent = "salvando…"; ind.className = "salvo"; }
    if(timerSalvar) clearTimeout(timerSalvar);
    timerSalvar = setTimeout(salvarAgora, 700);
  }

  function salvarAgora(){
    if(!rascunho) return;
    if(timerSalvar){ clearTimeout(timerSalvar); timerSalvar = null; }
    var copia = JSON.parse(JSON.stringify(rascunho));
    gravar(copia).then(function(){
      var ind = document.getElementById("ind-salvo");
      if(ind){ ind.textContent = "salvo"; ind.className = "salvo ok"; }
      pintarAba();
    }, function(){
      var ind = document.getElementById("ind-salvo");
      if(ind){ ind.textContent = "não foi possível salvar"; ind.className = "salvo erro"; }
    });
  }

  /* ---------------- partida ---------------- */
  app.innerHTML = '<div class="vazio"><b>Abrindo a central…</b>Carregando empresas e tarefas.</div>';
  Promise.all([carregarEmpresas(), carregarTarefas()]).then(repintar, function(e){
    erroServidor = "Não consegui falar com o servidor local (" + e.message + ").";
    repintar();
  });
})();
</script>
</body>
</html>
