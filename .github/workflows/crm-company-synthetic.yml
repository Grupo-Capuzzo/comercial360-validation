name: CRM company scope synthetic review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/crm-scope/**'
      - 'tools/crm-scope/**'
      - 'supabase/migrations/*crm_company_scope.sql'
      - 'package*.json'
      - '.github/workflows/crm-company-synthetic.yml'
permissions:
  contents: read
jobs:
  scoped-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:crm-scope
      - run: npm run typecheck
      - run: npm run build
# In-memory PostgreSQL only. No credentials, linked project, deploy or production SQL.
