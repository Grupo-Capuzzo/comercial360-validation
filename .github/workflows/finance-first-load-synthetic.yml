name: First load executor synthetic review
# One authorized synthetic CI round. No operational Supabase connection.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'tools/finance-first-load/**'
      - 'tools/finance-migration/**'
      - 'tools/portal-integration/read_projection.py'
      - '.github/workflows/finance-first-load-synthetic.yml'
permissions:
  contents: read
jobs:
  first-load:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'codex/finance-first-load' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/finance-first-load')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: capuzzo_test_regression
          POSTGRES_USER: synthetic_runner
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic_runner -d capuzzo_test_regression"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINANCE_LOCAL_POSTGRES_DSN: postgresql://synthetic_runner:synthetic_ci_only@127.0.0.1:5432/capuzzo_test_regression
      FIRST_LOAD_LOCAL_POSTGRES_DSN: postgresql://synthetic_runner:synthetic_ci_only@127.0.0.1:5432/capuzzo_test_first_load
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned synthetic driver
        run: python -m pip install -r tools/finance-migration/requirements-test.txt
      - name: Bootstrap disposable databases only
        run: |
          python - <<'PY'
          import os, psycopg
          from psycopg import sql
          with psycopg.connect(os.environ['FINANCE_LOCAL_POSTGRES_DSN'],autocommit=True) as db:
              db.execute("ALTER DATABASE capuzzo_test_regression SET capuzzo.disposable='synthetic-only'")
              db.execute('CREATE DATABASE capuzzo_test_first_load')
              db.execute("ALTER DATABASE capuzzo_test_first_load SET capuzzo.disposable='synthetic-only'")
              db.execute('CREATE DATABASE capuzzo_test_restore')
              db.execute("ALTER DATABASE capuzzo_test_restore SET capuzzo.disposable='synthetic-only'")
          PY
      - name: Existing Python regression tests
        run: |
          python tools/finance-migration/strict_tests.py test_engine.py 11
          python tools/finance-migration/strict_tests.py test_regressions.py 16
          python tools/finance-first-load/strict_run.py projection 6
      - name: New first-load unit tests
        run: python tools/finance-first-load/strict_run.py unit 47
      - name: Existing PostgreSQL regression (SQL roles, not JWT)
        run: python tools/finance-migration/strict_tests.py test_postgres.py 13
      - name: New executor PostgreSQL rehearsal (SQL sessions, not JWT)
        run: python tools/finance-first-load/strict_run.py postgres 15
      - name: Synthetic backup and isolated restore using PostgreSQL 17 utilities
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" pg_dump --version
          docker exec "$POSTGRES_CONTAINER" pg_dump -U synthetic_runner -d capuzzo_test_first_load -Fc -f /tmp/capuzzo_synthetic.dump
          docker exec "$POSTGRES_CONTAINER" pg_restore -U synthetic_runner -d capuzzo_test_restore --exit-on-error /tmp/capuzzo_synthetic.dump
          python tools/finance-first-load/verify_synthetic_restore.py
# No secrets, uploads of database files, deployment, Supabase connection or production data.
